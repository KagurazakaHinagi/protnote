[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protnote"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "wget==3.2",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "obonet==1.0.0",
    "blosum==2.0.2",
    "biopython==1.84",
]

[project.optional-dependencies]
ml = [
    "torchmetrics==1.4.0",
    "torcheval==0.0.7",
    "tensorboard==2.16.2",
    "transformers==4.40.0",
    "wandb==0.25.0",
    "sacremoses==0.0.53",
    "pynvml==11.5.0",
    "azureml-mlflow==1.53.0",
    "loralib==0.1.2",
    "umap-learn==0.5.4",
    "atomworks[ml,openbabel]>=2.2.0,<3",
    "esm @ git+https://github.com/KagurazakaHinagi/esm.git",
]

[tool.hatch.build.targets.wheel]
packages = ["protnote"]

[tool.hatch.build.targets.sdist]
include = [
    "protnote",
    "README.md",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 140
ignore = ["F841", "F401", "E712"]