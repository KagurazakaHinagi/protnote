[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
channel-priority = "disabled"

# Core conda deps shared by all environments (no GPU required)
[dependencies]
numpy = "<2.0"
pandas = ">=2.3.3,<3"
scipy = "1.13.1.*"
scikit-learn = "1.5.0.*"
matplotlib = "3.9.*"
seaborn = "0.13.2.*"
ipykernel = "6.29.5.*"
joblib = "1.2.0.*"
httpx = ">=0.28.1,<0.29"
setuptools = "<70"

[pypi-dependencies]
protnote = { path = ".", editable = true }
ipymolstar = ">=0.1.0"
jupyterlab = ">=4.0"

# Linux-specific system libraries
[target.linux-64.dependencies]
libstdcxx-ng = ">=15.2.0,<16"
libgcc-ng = ">=15.2.0,<16"

[target.linux-64.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

# --- GPU feature (training & inference) ---

[feature.ml]
platforms = ["linux-64"]
channels = ["nvidia"]

[feature.ml.pypi-dependencies]
protnote = { path = ".", editable = true, extras = ["ml"] }

[feature.ml.dependencies]
cuda-version = "12.9.*"
pytorch-gpu = "2.7.1.*"
torchvision = "0.22.1.*"
pytables = "3.8.0.*"
pyg-lib = ">=0.4.0,<1"
torch-scatter = ">=2.1.1,<3"
pytorch_sparse = ">=0.6.18,<1"
pytorch_cluster = ">=1.6.3,<2"
pytorch_spline_conv = ">=1.2.2,<2"
pytorch_geometric = ">=2.6.1,<3"

[feature.ml.system-requirements]
cuda = "12.9"

# --- MPNN feature (LigandMPNN inference) ---

[feature.mpnn]
platforms = ["linux-64"]

[feature.mpnn.dependencies]
python = ">=3.10,<3.12"

[feature.mpnn.pypi-dependencies]
torch = "==2.2.1"
numpy = "==1.23.5"
scipy = "==1.12.0"
networkx = "==3.2.1"
biopython = "==1.79"
prody = "==2.4.1"
ml-collections = "==0.1.1"
dm-tree = "==0.1.8"
hydra-core = ">=1.3,<2"
pandas = ">=2.3.3, <3"
setuptools = "<=81.0.0"

# --- Boltz feature (structure prediction) ---

[feature.boltz]
platforms = ["linux-64"]

[feature.boltz.dependencies]
python = ">=3.10,<3.12"

[feature.boltz.pypi-dependencies]
boltz = { version = "*", extras = ["cuda"] }

[feature.boltz.system-requirements]
cuda = "12.9"

# --- Util Tasks ---

[tasks]
dataprep = "python bin/data_helper.py download"

# --- Environments ---

[environments]
default = { features = ["ml"], solve-group = "ml" }
mpnn = { features = ["mpnn"], no-default-feature = true, solve-group = "mpnn" }
boltz = { features = ["boltz"], no-default-feature = true, solve-group = "boltz" }
dataprep = { features = [], solve-group = "dataprep" }
